services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-tracker}
      POSTGRES_USER: ${DB_USER:-tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tracker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tracker} -d ${DB_NAME:-tracker}"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
